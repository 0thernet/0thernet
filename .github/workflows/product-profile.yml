name: Update current product links

on:
  schedule:
    - cron: '47 10 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: current-product-profile
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.repository == '0thernet/0thernet' &&
      github.repository_id == '1342874174' &&
      github.repository_owner_id == '894119' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == 1342874174 &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (startsWith(github.event.workflow_run.head_branch, 'automation/profile-') ||
         startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: hraness/product-skills/actions/sync-profile@0ab5d4d1bde9099d1c24a3f1a81c675ffa53b53f # v0.1.88
        with:
          mode: ${{ github.event_name == 'workflow_run' && 'deliver' || 'refresh' }}
          check-workflow: check.yml
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          app-private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
